{% extends "base.html" %}
{% block content %}

<div class="payment-wrapper">
    <h2>Complete Your Payment</h2>

    <div class="payment-meta">
        <p>Booking ID: <strong>#{{ booking.id }}</strong></p>
        <p>Total Amount: <strong>Ksh {{ booking.total_amount }}</strong></p>
    </div>

    <form method="POST" class="payment-form">
        <label>Phone Number</label>
        <input type="text" name="phone" placeholder="07XXXXXXXX" required>

        <label>Amount</label>
        <input type="number" name="amount" min="1" placeholder="Enter amount" required>

        <button type="submit" class="payment-btn">
            Pay Now
        </button>
    </form>
</div>

{% endblock %}
