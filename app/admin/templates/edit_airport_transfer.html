
{% extends "admin_base.html" %}
{% block content %}

<div class="edit-transfer-page">
    <div class="edit-transfer-header">
        <div>
            <span>WHEELQ ADMINISTRATION</span>
            <h1>Edit Airport Transfer</h1>
            <p>Update customer details and the vehicle assigned to this transfer.</p>
        </div>
        <a href="{{ url_for('admin.airport_transfers') }}">← Back to Transfers</a>
    </div>

    <form method="POST" class="edit-transfer-card">
        <div class="edit-transfer-grid">
            <div>
                <label for="name">Customer Name *</label>
                <input id="name" name="name" value="{{ transfer.name or '' }}" required>
            </div>

            <div>
                <label for="phone_number">Phone Number *</label>
                <input id="phone_number" name="phone_number"
                       value="{{ transfer.phone_number or '' }}" required>
            </div>

            <div>
                <label for="email">Email Address *</label>
                <input id="email" name="email" type="email"
                       value="{{ transfer.email or '' }}" required>
            </div>

            <div>
                <label for="airport">Airport *</label>
                <input id="airport" name="airport"
                       value="{{ transfer.airport or '' }}" required>
            </div>

            <div class="edit-transfer-full">
                <label for="car_id">Assigned Vehicle</label>
                <select id="car_id" name="car_id">
                    <option value="">-- No vehicle assigned --</option>
                    {% for car in cars %}
                    <option value="{{ car.id }}"
                        {% if transfer.car_id == car.id %}selected{% endif %}>
                        {{ car.name }}
                        {% if car.registration_number %}
                            — {{ car.registration_number }}
                        {% endif %}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="price">Transfer Price (KSh)</label>
                <input
                    type="number"
                    id="price"
                    name="price"
                    class="form-control"
                    min="0.01"
                    step="0.01"
                    value="{{ transfer.financial_charge.amount_charged if transfer.financial_charge else '' }}"
                    placeholder="Enter transfer price"
                    required
                >
            </div>

            <div class="edit-transfer-full">
                <label for="notes">Additional Notes</label>
                <textarea id="notes" name="notes" rows="5">{{ transfer.notes or '' }}</textarea>
            </div>
        </div>

        <div class="edit-transfer-footer">
            <a href="{{ url_for('admin.airport_transfers') }}"
               class="edit-transfer-back">Discard Changes</a>
            <button type="submit">Save Changes</button>
        </div>
    </form>
</div>

<style>
.edit-transfer-page {
    max-width: 1000px;
    margin: 0 auto;
    padding: 28px;
    color: #272b36;
}

.edit-transfer-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    margin-bottom: 25px;
}

.edit-transfer-header span {
    color: #b30000;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 1.5px;
}

.edit-transfer-header h1 {
    margin: 8px 0;
    font-size: 29px;
    font-weight: 800;
}

.edit-transfer-header p {
    margin: 0;
    color: #777f8e;
    font-size: 13px;
}

.edit-transfer-header a {
    color: #b30000;
    text-decoration: none;
    font-size: 12px;
    font-weight: 750;
    white-space: nowrap;
}

.edit-transfer-card {
    padding: 27px;
    border: 1px solid #e7e9ef;
    border-radius: 13px;
    background: #fff;
    box-shadow: 0 4px 18px rgba(20,27,45,.05);
}

.edit-transfer-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 20px;
}

.edit-transfer-grid label {
    display: block;
    margin-bottom: 8px;
    color: #414755;
    font-size: 12px;
    font-weight: 750;
}

.edit-transfer-grid input,
.edit-transfer-grid select,
.edit-transfer-grid textarea {
    width: 100%;
    min-height: 44px;
    padding: 11px 13px;
    border: 1px solid #dfe3eb;
    border-radius: 8px;
    outline: none;
    background: #fff;
    color: #272b36;
    font: inherit;
    font-size: 13px;
    box-sizing: border-box;
}

.edit-transfer-grid textarea { resize: vertical; }

.edit-transfer-grid input:focus,
.edit-transfer-grid select:focus,
.edit-transfer-grid textarea:focus {
    border-color: #b30000;
    box-shadow: 0 0 0 3px rgba(179,0,0,.08);
}

.edit-transfer-full { grid-column: 1 / -1; }

.edit-transfer-footer {
    display: flex;
    justify-content: flex-end;
    gap: 12px;
    margin-top: 25px;
    padding-top: 20px;
    border-top: 1px solid #e7e9ef;
}

.edit-transfer-footer a,
.edit-transfer-footer button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 42px;
    padding: 0 17px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 750;
    text-decoration: none;
    cursor: pointer;
}

.edit-transfer-back {
    border: 1px solid #dfe3eb;
    background: #fff;
    color: #454b59;
}

.edit-transfer-footer button {
    border: 1px solid #b30000;
    background: #b30000;
    color: #fff;
}

.edit-transfer-footer button:hover { background: #850000; }

@media (max-width: 650px) {
    .edit-transfer-page { padding: 15px; }
    .edit-transfer-header { align-items: flex-start; flex-direction: column; }
    .edit-transfer-grid { grid-template-columns: 1fr; }
    .edit-transfer-full { grid-column: auto; }
    .edit-transfer-card { padding: 18px; }
}
</style>

{% endblock %}
