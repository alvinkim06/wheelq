{% extends "admin_base.html" %}
{% block content %}

<div class="release-card">
    <h3 class="release-title">🚗 Release Vehicle</h3>

    <p class="release-note">
        Before releasing the vehicle, ensure the hire agreement is downloaded
        and signed by the client.
    </p>

    <div class="release-actions">
        <a href="{{ url_for('admin.download_agreement', booking_id=booking.id) }}"
           class="btn btn-outline-primary">
            📄 Download Hire Agreement
        </a>

        <a href="{{ url_for('admin.activate_booking', booking_id=booking.id) }}"
           class="btn btn-success"
           onclick="return confirm('Are you sure you want to release this vehicle to the client?');">
            ✅ Release Vehicle
        </a>
    </div>
</div>
<style>
    .release-card {
    background: #ffffff;
    border-radius: 8px;
    padding: 25px;
    max-width: 600px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    border-left: 5px solid #28a745;
}

.release-title {
    margin-bottom: 10px;
    font-weight: 600;
    color: #333;
}

.release-note {
    font-size: 14px;
    color: #666;
    margin-bottom: 20px;
}

.release-actions {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
}

.release-actions .btn {
    padding: 10px 18px;
    font-size: 14px;
    border-radius: 5px;
}
</style>
{% endblock %}
