{% extends "admin_base.html" %}
{% block title %}Register Client - WheelQ{% endblock %}

{% block content %}
<h1 class="page-title">Register New Client</h1>

<div class="form-container" style="max-width:700px; margin:auto; margin-top:30px;">
    <form action="{{ url_for('admin.register_client') }}" method="POST" enctype="multipart/form-data" style="display:flex; flex-direction:column; gap:15px;">

        <!-- Personal Details -->
        <h3>Personal Details</h3>
        <div class="form-group">
            <label>Full Name</label>
            <input type="text" name="name" required>
        </div>
        <div class="form-group">
            <label>Phone Number</label>
            <input type="text" name="phone" required>
        </div>
        <div class="form-group">
            <label>Email Address</label>
            <input type="email" name="email" required>
        </div>
        <div class="form-group">
            <label>ID Number</label>
            <input type="text" name="id_number" required>
        </div>
        <div class="form-group">
            <label>Driving License Number</label>
            <input type="text" name="drivers_license_number" required>
        </div>
        <div class="form-group">
            <label>Area of Residence</label>
            <input type="text" name="area_of_residence" required>
        </div>
        <div class="form-group">
            <label>Area of Usage</label>
            <input type="text" name="area_of_usage" required>
        </div>

        <!-- Documents -->
        <h3>Documents</h3>
        <div class="form-group">
            <label>ID Front Image</label>
            <input type="file" name="id_front" required>
        </div>
        <div class="form-group">
            <label>ID Back Image</label>
            <input type="file" name="id_back" required>
        </div>
        <div class="form-group">
            <label>Driver’s License</label>
            <input type="file" name="drivers_license" required>
        </div>
        <div class="form-group">
            <label>Passport (optional)</label>
            <input type="file" name="passport">
        </div>

        <!-- Emergency Contacts -->
        <h3>Emergency Contact 1</h3>
        <div class="form-group">
            <label>Contact Name</label>
            <input type="text" name="emergency_contact1_name">
        </div>
        <div class="form-group">
            <label>Phone Number</label>
            <input type="text" name="emergency_contact1_phone">
        </div>
        <div class="form-group">
            <label>Relationship</label>
            <input type="text" name="emergency_contact1_relationship">
        </div>
        <div class="form-group">
            <label>Area of Residence</label>
            <input type="text" name="emergency_contact1_area">
        </div>

        <h3>Emergency Contact 2</h3>
        <div class="form-group">
            <label>Contact Name</label>
            <input type="text" name="emergency_contact2_name">
        </div>
        <div class="form-group">
            <label>Phone Number</label>
            <input type="text" name="emergency_contact2_phone">
        </div>
        <div class="form-group">
            <label>Relationship</label>
            <input type="text" name="emergency_contact2_relationship">
        </div>
        <div class="form-group">
            <label>Area of Residence</label>
            <input type="text" name="emergency_contact2_area">
        </div>

        <h3>Emergency Contact 3</h3>
        <div class="form-group">
            <label>Contact Name</label>
            <input type="text" name="emergency_contact3_name">
        </div>
        <div class="form-group">
            <label>Phone Number</label>
            <input type="text" name="emergency_contact3_phone">
        </div>
        <div class="form-group">
            <label>Relationship</label>
            <input type="text" name="emergency_contact3_relationship">
        </div>
        <div class="form-group">
            <label>Area of Residence</label>
            <input type="text" name="emergency_contact3_area">
        </div>

        <button type="submit" class="btn-primary">Register Client</button>
    </form>
</div>
{% endblock %}
