{% extends "admin_base.html" %}
{% block content %}
<h2>Edit Booking</h2>

<form method="POST">
    <label>Client Name</label>
    <input type="text" name="client_name" value="{{ booking.client_name }}" required>

    <label>Email</label>
    <input type="email" name="client_email" value="{{ booking.client_email }}" required>

    <label>Phone</label>
    <input type="text" name="client_phone" value="{{ booking.client_phone }}" required>

    <label>Notes</label>
    <textarea name="notes">{{ booking.notes }}</textarea>

    <button type="submit">Save Changes</button>
</form>
{% endblock %}
