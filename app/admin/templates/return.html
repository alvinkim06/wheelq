{% extends 'admin_base.html' %}
{% block content %}

<div class="return-card">
    <h3 class="return-title">🔁 Vehicle Return</h3>

    <p class="return-note">
        Record vehicle condition and any additional charges before completing
        the return process.
    </p>

    <form method="post" class="return-form">
        <div class="form-group">
            <label>Damage Notes</label>
            <textarea name="damage_notes"
                      placeholder="Describe any visible damages or issues..."></textarea>
        </div>

        <div class="form-group">
            <label>Extra Charges (optional)</label>
            <input type="number"
                   name="extra_charges"
                   min="0"
                   step="0.01"
                   placeholder="e.g. 2500">
        </div>

        <button type="submit"
                class="btn btn-success"
                onclick="return confirm('Confirm vehicle return and close booking?');">
            ✅ Confirm Return
        </button>
    </form>
</div>
<style>
    .return-card {
    background: #ffffff;
    border-radius: 8px;
    padding: 25px;
    max-width: 600px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    border-left: 5px solid #007bff;
}

.return-title {
    margin-bottom: 10px;
    font-weight: 600;
    color: #333;
}

.return-note {
    font-size: 14px;
    color: #666;
    margin-bottom: 20px;
}

.return-form .form-group {
    margin-bottom: 15px;
}

.return-form label {
    display: block;
    font-weight: 500;
    margin-bottom: 5px;
}

.return-form textarea,
.return-form input {
    width: 100%;
    padding: 10px;
    border-radius: 5px;
    border: 1px solid #ccc;
    font-size: 14px;
}

.return-form textarea {
    min-height: 100px;
    resize: vertical;
}

.return-form input:focus,
.return-form textarea:focus {
    outline: none;
    border-color: #007bff;
}

.return-form button {
    margin-top: 10px;
    padding: 10px 18px;
    font-size: 14px;
    border-radius: 5px;
}

</style>
{% endblock %}
