{% extends "admin_base.html" %}
{% block content %}
<div class="container mt-5">
    <div class="card shadow-sm p-4">
        <h2 class="mb-4">Pay Booking #{{ booking.id }}</h2>

        <div class="mb-3">
            <strong>Client:</strong> {{ booking.client_name }}<br>
            <strong>Phone:</strong> {{ booking.client_phone }}<br>
            <strong>Car:</strong> {{ booking.car.name if booking.car else 'N/A' }}<br>
            <strong>Total Amount:</strong> KES {{ booking.car.price }}
        </div>

        <form method="POST" class="mt-4">
            <div class="form-group mb-3">
                <label for="amount" class="form-label">Amount to charge (KES)</label>
                <input type="number" class="form-control" name="amount" id="amount" value="{{ booking.total_amount }}" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Send Payment Request</button>
        </form>
    </div>
</div>

<style>
    .card {
        border-radius: 10px;
        background-color: #ffffff;
    }
    .form-label {
        font-weight: 500;
    }
    .btn-primary {
        background-color: #007bff;
        border: none;
        font-weight: 500;
    }
    .btn-primary:hover {
        background-color: #0056b3;
    }
</style>
{% endblock %}
